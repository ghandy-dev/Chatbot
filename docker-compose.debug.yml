services:
  chatbot:
    image: chatbot
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - configuration=Debug
    networks:
      - private_network
    env_file:
      - .env
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
      - ./data/:/app/data/

networks:
  private_network:
    driver: bridge